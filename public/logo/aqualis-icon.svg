<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Paleta Starkio: área Software #059669, acento Starkio Purple #6C63FF -->
    <linearGradient id="gOuter" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="gInner" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gDrop" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="gHouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <!-- Acento púrpura Starkio en el brillo lateral -->
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- Anillo exterior -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.35"/>

  <!-- Base -->
  <circle cx="100" cy="100" r="88" fill="url(#gOuter)"/>
  <circle cx="100" cy="100" r="82" fill="url(#gInner)"/>

  <g clip-path="url(#clip)">

    <!-- Toque de acento Starkio Purple en el lateral izquierdo -->
    <ellipse cx="52" cy="80" rx="38" ry="60" fill="url(#gAccent)"/>

    <!-- Flujo izquierdo curvo -->
    <path d="M100,22 C100,22 58,52 52,78 C48,96 58,110 72,114 C60,100 62,82 72,68 C80,56 92,46 100,38 Z"
          fill="white" opacity="0.15"/>

    <!-- Flujo derecho curvo -->
    <path d="M100,22 C100,22 142,52 148,78 C152,96 142,110 128,114 C140,100 138,82 128,68 C120,56 108,46 100,38 Z"
          fill="#065f46" opacity="0.3"/>

    <!-- Punta gota superior -->
    <path d="M100,28 C97,38 90,50 90,60 C90,70 94,76 100,78 C106,76 110,70 110,60 C110,50 103,38 100,28 Z"
          fill="url(#gDrop)"/>

    <!-- Ola de fondo -->
    <path d="M18,130 C35,118 55,122 70,130 C85,138 98,142 115,134 C130,126 150,118 182,124 L182,185 L18,185 Z"
          fill="#065f46" opacity="0.6"/>

    <!-- Colinas -->
    <ellipse cx="72"  cy="158" rx="48" ry="22" fill="url(#gHill)"/>
    <ellipse cx="132" cy="162" rx="46" ry="20" fill="#047857"/>
    <ellipse cx="100" cy="168" rx="68" ry="26" fill="#022c22"/>

    <!-- Casa principal -->
    <rect x="72" y="146" width="22" height="17" rx="1.5" fill="url(#gHouse)"/>
    <path d="M69,147 L83,133 L97,147 Z" fill="#ecfdf5"/>
    <rect x="79" y="155" width="7" height="8" rx="1" fill="#047857"/>
    <rect x="72" y="149" width="5" height="5" rx="0.5" fill="#047857" opacity="0.7"/>
    <!-- chimenea -->
    <rect x="88" y="135" width="4" height="8" rx="0.5" fill="#a7f3d0"/>
    <path d="M90,134 C92,129 88,125 91,121" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- Casa secundaria -->
    <rect x="106" y="151" width="17" height="14" rx="1.5" fill="white" opacity="0.65"/>
    <path d="M104,152 L114,141 L125,152 Z" fill="white" opacity="0.8"/>
    <rect x="111" y="158" width="5"  height="7" rx="1" fill="#047857" opacity="0.7"/>

    <!-- Ondas agua -->
    <path d="M18,148 Q45,140 72,148 Q100,156 128,148 Q155,140 182,148"
          stroke="white" stroke-width="2"   fill="none" stroke-linecap="round" opacity="0.28"/>
    <path d="M18,158 Q50,150 80,158 Q110,166 140,158 Q162,152 182,156"
          stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.16"/>

    <!-- Brillo superior -->
    <ellipse cx="78" cy="58" rx="6" ry="14" fill="white" opacity="0.14" transform="rotate(-20,78,58)"/>

  </g>

  <!-- Bordes finales -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="white"   stroke-width="1"   opacity="0.1"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#065f46" stroke-width="1.5" opacity="0.2"/>
</svg>
