<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de Marca Blazon: Starkio Purple #6C63FF -> Data Blue #2563EB -> Software Green #059669 -->
    <linearGradient id="blazonShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="52%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blazonHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blazonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura perimetral sutil -->
  <path d="M50 8 L88 20 V52 C88 74 72 90 50 100 C28 90 12 74 12 52 V20 Z"
        fill="url(#blazonShieldGrad)" opacity="0.25" filter="url(#blazonGlow)"/>

  <!-- Escudo Heráldico Principal -->
  <path d="M50 6 L88 18 V50 C88 72 72 88 50 98 C28 88 12 72 12 50 V18 Z"
        fill="url(#blazonShieldGrad)"/>

  <!-- Faceta derecha con luz reflejada -->
  <path d="M50 6 L88 18 V50 C88 72 72 88 50 98 Z"
        fill="#FFFFFF" opacity="0.12"/>

  <!-- Brillo superior biselado -->
  <path d="M50 6 L88 18 L76 23 L50 15 L24 23 L12 18 Z"
        fill="url(#blazonHighlight)"/>

  <!-- Eje central divisor -->
  <path d="M50 16 L50 88" stroke="#08080F" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Trazo heráldico horizontal en v -->
  <path d="M22 26 L50 16 L78 26" stroke="#08080F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Puntos acento corporativos (Data & AI) -->
  <circle cx="50" cy="46" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="50" cy="62" r="2" fill="#FFFFFF" opacity="0.6"/>
</svg>
