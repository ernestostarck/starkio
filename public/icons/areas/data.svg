<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="dataGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="dataGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowEffectData" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura de fondo -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#dataGlow)" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Servidor / Cilindro de Datos Base -->
  <path d="M14 20 C14 17 22 15 32 15 C42 15 50 17 50 20 C50 23 42 25 32 25 C22 25 14 23 14 20 Z" fill="url(#dataGrad1)"/>
  <path d="M14 20 V28 C14 31 22 33 32 33 C42 33 50 31 50 28 V20" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>
  <path d="M14 28 V36 C14 39 22 41 32 41 C42 41 50 39 50 36 V28" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M14 36 V44 C14 47 22 49 32 49 C42 49 50 47 50 44 V36" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Gráfico de tendencia analítica / Pipeline -->
  <path d="M18 36 L27 27 L36 31 L46 21" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffectData)"/>
  
  <!-- Nodos de métricas clave -->
  <circle cx="27" cy="27" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="36" cy="31" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="46" cy="21" r="3.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Pulso dinámico de datos -->
  <circle cx="46" cy="21" r="6" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M22 19.5 C26 21 38 21 42 19.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
