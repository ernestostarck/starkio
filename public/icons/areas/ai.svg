<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowEffectAi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura de fondo -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#aiGlow)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Red Neuronal / Conexiones Sinápticas -->
  <g stroke="#C084FC" stroke-width="1.5" opacity="0.6">
    <!-- Eje Central a Nodos Externos -->
    <line x1="32" y1="32" x2="20" y2="18"/>
    <line x1="32" y1="32" x2="44" y2="18"/>
    <line x1="32" y1="32" x2="16" y2="34"/>
    <line x1="32" y1="32" x2="48" y2="34"/>
    <line x1="32" y1="32" x2="22" y2="47"/>
    <line x1="32" y1="32" x2="42" y2="47"/>
    <!-- Vínculos periféricos -->
    <line x1="20" y1="18" x2="32" y2="14"/>
    <line x1="44" y1="18" x2="32" y2="14"/>
    <line x1="20" y1="18" x2="16" y2="34"/>
    <line x1="44" y1="18" x2="48" y2="34"/>
    <line x1="16" y1="34" x2="22" y2="47"/>
    <line x1="48" y1="34" x2="42" y2="47"/>
  </g>

  <!-- Núcleo de Inteligencia Central (Tensor Core) -->
  <circle cx="32" cy="32" r="8" fill="url(#aiGrad1)" filter="url(#glowEffectAi)"/>
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>

  <!-- Nodos Sinápticos Activos -->
  <circle cx="32" cy="14" r="3" fill="#E9D5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="20" cy="18" r="3" fill="#A855F7" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="44" cy="18" r="3" fill="#A855F7" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="16" cy="34" r="3" fill="#C084FC" stroke="#6B21A8" stroke-width="1.5"/>
  <circle cx="48" cy="34" r="3" fill="#C084FC" stroke="#6B21A8" stroke-width="1.5"/>
  <circle cx="22" cy="47" r="3" fill="#E9D5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="42" cy="47" r="3" fill="#E9D5FF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Anillo orbital de entrenamiento de modelos -->
  <circle cx="32" cy="32" r="14" stroke="#E9D5FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
</svg>
