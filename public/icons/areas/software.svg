<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="softwareGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="softwareGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowEffectSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura de fondo -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#softwareGlow)" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Bloque / Plataforma Isométrica Central -->
  <g transform="translate(32, 28)">
    <!-- Cara superior del bloque -->
    <path d="M0 -12 L16 -4 L0 4 L-16 -4 Z" fill="url(#softwareGrad1)"/>
    <!-- Cara izquierda -->
    <path d="M-16 -4 L0 4 V16 L-16 8 Z" fill="#047857"/>
    <!-- Cara derecha -->
    <path d="M0 4 L16 -4 V8 L0 16 Z" fill="#065F46"/>
  </g>

  <!-- Brackets de Código y Arquitectura Limpia -->
  <!-- Bracket Izquierdo '<' -->
  <path d="M18 24 L11 31 L18 38" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffectSoft)"/>

  <!-- Bracket Derecho '>' -->
  <path d="M46 24 L53 31 L46 38" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffectSoft)"/>

  <!-- Línea Slash de Cierre de Código '/' -->
  <path d="M35 15 L29 45" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Conectores y Microservicios -->
  <circle cx="32" cy="16" r="3" fill="#A7F3D0" stroke="#047857" stroke-width="1.5"/>
  <circle cx="21" cy="44" r="2.5" fill="#34D399"/>
  <circle cx="43" cy="44" r="2.5" fill="#34D399"/>
  <path d="M24 44 H40" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
</svg>
