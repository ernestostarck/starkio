<svg width="100%" height="96" viewBox="0 0 700 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de conexión hídrica y cloud -->
    <linearGradient id="aqConnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>

    <!-- Fondos de tarjetas con relieve -->
    <linearGradient id="aqBoxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D24"/>
      <stop offset="100%" stop-color="#081A15"/>
    </linearGradient>
    <linearGradient id="aqBoxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1738"/>
      <stop offset="100%" stop-color="#0E0C22"/>
    </linearGradient>

    <!-- Resplandores -->
    <filter id="aqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Marco perimetral del diagrama con efecto glassmorphism -->
  <rect x="1.5" y="1.5" width="697" height="93" rx="14" fill="#061411" fill-opacity="0.85" stroke="#34D399" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Línea de Bus de Datos Principal con Acento Gradiente -->
  <path d="M 188 48 L 264 48" stroke="url(#aqConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <path d="M 436 48 L 512 48" stroke="url(#aqConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Flechas y Pulso en Tránsito -->
  <polygon points="260,44.5 266,48 260,51.5" fill="#34D399"/>
  <polygon points="508,44.5 514,48 508,51.5" fill="#6C63FF"/>
  <circle cx="206" cy="48" r="3.5" fill="#A7F3D0" filter="url(#aqGlow)"/>
  <circle cx="454" cy="48" r="3.5" fill="#A78BFA" filter="url(#aqGlow)"/>

  <!-- Chip Protocolo 1 (HTTPS TLS) -->
  <rect x="201" y="22" width="50" height="15" rx="7.5" fill="#09221B" stroke="#34D399" stroke-width="0.8"/>
  <text x="226" y="32.5" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">TLS 1.3</text>

  <!-- Chip Protocolo 2 (TELEMETRÍA) -->
  <rect x="445" y="22" width="58" height="15" rx="7.5" fill="#14112E" stroke="#818CF8" stroke-width="0.8"/>
  <text x="474" y="32.5" text-anchor="middle" fill="#A78BFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">TELEMETRÍA</text>

  <!-- ========================================== -->
  <!-- 1. NODO AQUALIS (Izquierda) -->
  <!-- ========================================== -->
  <g transform="translate(16, 16)">
    <rect width="172" height="64" rx="10" fill="url(#aqBoxGrad1)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <!-- Ícono Gota Hídrica Aqualis -->
    <circle cx="26" cy="32" r="14" fill="#047857" fill-opacity="0.55"/>
    <path d="M 26 21 C 26 21 19 30 19 33.5 C 19 37.2 22.1 40 26 40 C 29.9 40 33 37.2 33 33.5 C 33 30 26 21 26 21 Z" fill="#34D399"/>
    
    <!-- Textos con tipografía estructurada y legible -->
    <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">FILIAL HÍDRICA</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Aqualis Core APR</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" opacity="0.9">Telemetría IoT &amp; Facturación</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. STARKIO CLOUD (Centro) -->
  <!-- ========================================== -->
  <g transform="translate(264, 16)">
    <rect width="172" height="64" rx="10" fill="url(#aqBoxGrad2)" stroke="#6C63FF" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Ícono Nube Central -->
    <circle cx="26" cy="32" r="14" fill="#6C63FF" fill-opacity="0.25"/>
    <path d="M 19 34.5 A 4.5 4.5 0 0 1 23 30 A 7 7 0 0 1 31.5 30 A 4.5 4.5 0 0 1 33 34.5 H 19 Z" stroke="#C4B5FD" stroke-width="1.6" fill="#6C63FF" fill-opacity="0.5"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#A78BFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">BACKEND CENTRAL</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Starkio Cloud API</text>
    <text x="48" y="53" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" opacity="0.9">Bus HTTPS &amp; Eventos</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. STARKIO MANAGER (Derecha) -->
  <!-- ========================================== -->
  <g transform="translate(512, 16)">
    <rect width="172" height="64" rx="10" fill="url(#aqBoxGrad1)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <!-- Ícono Servidor / Flota -->
    <circle cx="26" cy="32" r="14" fill="#047857" fill-opacity="0.55"/>
    <rect x="19" y="24" width="14" height="6" rx="1.5" fill="#34D399"/>
    <rect x="19" y="33" width="14" height="6" rx="1.5" fill="#34D399" opacity="0.75"/>
    <circle cx="30" cy="27" r="1.2" fill="#FFFFFF"/>
    <circle cx="30" cy="36" r="1.2" fill="#FFFFFF"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">CONTROL DE FLOTA</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Starkio Manager</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" opacity="0.9">Diagnóstico &amp; Monitoreo</text>
  </g>
</svg>
