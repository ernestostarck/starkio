<svg width="100%" height="90" viewBox="0 0 680 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aqConnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="aqBoxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E332A"/>
      <stop offset="100%" stop-color="#061D17"/>
    </linearGradient>
    <linearGradient id="aqBoxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181736"/>
      <stop offset="100%" stop-color="#0D0C1D"/>
    </linearGradient>
    <filter id="aqGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo base del diagrama con borde sutil -->
  <rect x="1" y="1" width="678" height="88" rx="14" fill="#071714" fill-opacity="0.75" stroke="#34D399" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Línea de Bus de Datos Principal con Acento Gradiente -->
  <path d="M 180 45 L 260 45" stroke="url(#aqConnGrad)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 420 45 L 500 45" stroke="url(#aqConnGrad)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Flechas y Pulso en Tránsito -->
  <polygon points="256,42 262,45 256,48" fill="#34D399"/>
  <polygon points="496,42 502,45 496,48" fill="#6C63FF"/>
  <circle cx="220" cy="45" r="3" fill="#A7F3D0" filter="url(#aqGlow)"/>
  <circle cx="460" cy="45" r="3" fill="#A78BFA" filter="url(#aqGlow)"/>

  <!-- 1. NODO AQUALIS (Izquierda) -->
  <g transform="translate(16, 15)">
    <rect width="164" height="60" rx="10" fill="url(#aqBoxGrad1)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.4"/>
    <!-- Ícono Gota Hídrica Aqualis -->
    <circle cx="28" cy="30" r="14" fill="#047857" fill-opacity="0.5"/>
    <path d="M 28 20 C 28 20 22 28 22 31 C 22 34.3 24.7 37 28 37 C 31.3 37 34 34.3 34 31 C 34 28 28 20 28 20 Z" fill="#34D399"/>
    <text x="50" y="27" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="12">Aqualis Nodo APR</text>
    <text x="50" y="42" fill="#A7F3D0" font-family="JetBrains Mono, monospace" font-size="9" opacity="0.8">Telemetría IoT &amp; Facturación</text>
  </g>

  <!-- 2. STARKIO CLOUD (Centro) -->
  <g transform="translate(260, 15)">
    <rect width="160" height="60" rx="10" fill="url(#aqBoxGrad2)" stroke="#6C63FF" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Ícono Nube Central -->
    <circle cx="28" cy="30" r="14" fill="#6C63FF" fill-opacity="0.2"/>
    <path d="M 22 32 A 4 4 0 0 1 25.5 28 A 6 6 0 0 1 33 28 A 4 4 0 0 1 35 32 H 22 Z" stroke="#A78BFA" stroke-width="1.5" fill="#6C63FF" fill-opacity="0.4"/>
    <text x="48" y="27" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="12">Starkio Cloud API</text>
    <text x="48" y="42" fill="#C4B5FD" font-family="JetBrains Mono, monospace" font-size="9" opacity="0.85">Bus HTTPS &amp; Eventos</text>
  </g>

  <!-- 3. STARKIO MANAGER (Derecha) -->
  <g transform="translate(500, 15)">
    <rect width="164" height="60" rx="10" fill="url(#aqBoxGrad1)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.4"/>
    <!-- Ícono Servidor / Flota -->
    <circle cx="28" cy="30" r="14" fill="#047857" fill-opacity="0.5"/>
    <rect x="21" y="23" width="14" height="5" rx="1.5" fill="#34D399"/>
    <rect x="21" y="31" width="14" height="5" rx="1.5" fill="#34D399" opacity="0.7"/>
    <circle cx="32" cy="25.5" r="1" fill="#FFFFFF"/>
    <circle cx="32" cy="33.5" r="1" fill="#FFFFFF"/>
    <text x="48" y="27" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="12">Starkio Manager</text>
    <text x="48" y="42" fill="#A7F3D0" font-family="JetBrains Mono, monospace" font-size="9" opacity="0.8">Control Tech Lead &amp; Flota</text>
  </g>
</svg>
