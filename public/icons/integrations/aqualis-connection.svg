<svg width="100%" height="96" viewBox="0 0 700 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de conexión hídrica institucional -->
    <linearGradient id="aqConnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Fondos de tarjetas con relieve -->
    <linearGradient id="aqBoxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D24"/>
      <stop offset="100%" stop-color="#081A15"/>
    </linearGradient>
    <linearGradient id="aqBoxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11382C"/>
      <stop offset="100%" stop-color="#071E17"/>
    </linearGradient>

    <!-- Resplandores -->
    <filter id="aqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Marco perimetral del diagrama con efecto glassmorphism -->
  <rect x="1.5" y="1.5" width="697" height="93" rx="14" fill="#061411" fill-opacity="0.88" stroke="#34D399" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Línea de Bus de Datos Principal con Acento Gradiente -->
  <path d="M 188 48 L 264 48" stroke="url(#aqConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <path d="M 436 48 L 512 48" stroke="url(#aqConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Flechas y Pulso en Tránsito -->
  <polygon points="260,44.5 266,48 260,51.5" fill="#34D399"/>
  <polygon points="508,44.5 514,48 508,51.5" fill="#34D399"/>
  <circle cx="206" cy="48" r="3.5" fill="#A7F3D0" filter="url(#aqGlow)"/>
  <circle cx="454" cy="48" r="3.5" fill="#A7F3D0" filter="url(#aqGlow)"/>

  <!-- Chip Protocolo 1 (TELEMETRÍA IOT) -->
  <rect x="195" y="22" width="62" height="15" rx="7.5" fill="#09221B" stroke="#34D399" stroke-width="0.8"/>
  <text x="226" y="32.5" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">TELEMETRÍA</text>

  <!-- Chip Protocolo 2 (LEY N° 20.998) -->
  <rect x="439" y="22" width="70" height="15" rx="7.5" fill="#09221B" stroke="#34D399" stroke-width="0.8"/>
  <text x="474" y="32.5" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">LEY N° 20.998</text>

  <!-- ========================================== -->
  <!-- 1. NODO RED APR & TELEMETRÍA IOT (Izquierda) -->
  <!-- ========================================== -->
  <g transform="translate(16, 16)">
    <rect width="172" height="64" rx="10" fill="url(#aqBoxGrad1)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <!-- Ícono Antena / Sensores Caudal & Presión -->
    <circle cx="26" cy="32" r="14" fill="#047857" fill-opacity="0.55"/>
    <!-- Medidor / Manómetro analógico con dial -->
    <circle cx="26" cy="32" r="7.5" stroke="#A7F3D0" stroke-width="1.4" fill="#064E3B"/>
    <line x1="26" y1="32" x2="29" y2="28" stroke="#34D399" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="26" cy="32" r="1.5" fill="#FFFFFF"/>
    <!-- Ondas de transmisión de telemetría -->
    <path d="M 21 21 C 24 19 28 19 31 21" stroke="#34D399" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">RED SANITARIA RURAL</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Telemetría &amp; IoT</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" opacity="0.9">Caudal, Presión y Estanque</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. NODO AQUALIS CORE SSR (Centro) -->
  <!-- ========================================== -->
  <g transform="translate(264, 16)">
    <rect width="172" height="64" rx="10" fill="url(#aqBoxGrad2)" stroke="#34D399" stroke-width="1.4" stroke-opacity="0.75"/>
    
    <!-- Ícono Gota Hídrica Aqualis Core -->
    <circle cx="26" cy="32" r="14" fill="#047857" fill-opacity="0.6"/>
    <path d="M 26 21 C 26 21 19 30 19 33.5 C 19 37.2 22.1 40 26 40 C 29.9 40 33 37.2 33 33.5 C 33 30 26 21 26 21 Z" fill="#34D399"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">PLATAFORMA CENTRAL</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Aqualis Cloud SSR</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" opacity="0.9">Gestión, Catastro &amp; Cobro</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. NODO LEY N° 20.998 & PAGOS (Derecha) -->
  <!-- ========================================== -->
  <g transform="translate(512, 16)">
    <rect width="172" height="64" rx="10" fill="url(#aqBoxGrad1)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <!-- Ícono Documento Regulatorio & Pagos -->
    <circle cx="26" cy="32" r="14" fill="#047857" fill-opacity="0.55"/>
    <!-- Documento / Ley con sello -->
    <rect x="20" y="23" width="12" height="17" rx="1.5" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
    <line x1="23" y1="27" x2="29" y2="27" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round"/>
    <line x1="23" y1="31" x2="29" y2="31" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round"/>
    <line x1="23" y1="35" x2="27" y2="35" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">NORMATIVA SSR · DOH</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Ley N° 20.998</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" opacity="0.9">Reportes DOH &amp; Recaudación</text>
  </g>
</svg>
