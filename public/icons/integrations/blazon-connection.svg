<svg width="100%" height="96" viewBox="0 0 700 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de conexión Blazon -> Brand Engine -> Tokens -->
    <linearGradient id="blzConnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Fondos de tarjetas con relieve sutil -->
    <linearGradient id="blzBoxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1638"/>
      <stop offset="100%" stop-color="#0E0A1E"/>
    </linearGradient>
    <linearGradient id="blzBoxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221545"/>
      <stop offset="100%" stop-color="#120A28"/>
    </linearGradient>
    <linearGradient id="blzBoxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2E24"/>
      <stop offset="100%" stop-color="#071A14"/>
    </linearGradient>

    <!-- Resplandores -->
    <filter id="blzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Marco perimetral del diagrama con efecto glassmorphism -->
  <rect x="1.5" y="1.5" width="697" height="93" rx="14" fill="#0A0817" fill-opacity="0.88" stroke="#6C63FF" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Línea de Conexión de Tokens y Assets con Acento Gradiente -->
  <path d="M 188 48 L 264 48" stroke="url(#blzConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <path d="M 436 48 L 512 48" stroke="url(#blzConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Flechas y Pulso en Tránsito -->
  <polygon points="260,44.5 266,48 260,51.5" fill="#6C63FF"/>
  <polygon points="508,44.5 514,48 508,51.5" fill="#34D399"/>
  <circle cx="206" cy="48" r="3.5" fill="#A78BFA" filter="url(#blzGlow)"/>
  <circle cx="454" cy="48" r="3.5" fill="#6EE7B7" filter="url(#blzGlow)"/>

  <!-- Chip Protocolo 1 (ADD-IN M365) -->
  <rect x="195" y="22" width="62" height="15" rx="7.5" fill="#1C1838" stroke="#818CF8" stroke-width="0.8"/>
  <text x="226" y="32.5" text-anchor="middle" fill="#A78BFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">ADD-IN M365</text>

  <!-- Chip Protocolo 2 (TOKENS SYNC) -->
  <rect x="444" y="22" width="60" height="15" rx="7.5" fill="#0E2A20" stroke="#34D399" stroke-width="0.8"/>
  <text x="474" y="32.5" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">TOKENS SYNC</text>

  <!-- ========================================== -->
  <!-- 1. BLAZON SUITE (Izquierda) -->
  <!-- ========================================== -->
  <g transform="translate(16, 16)">
    <rect width="172" height="64" rx="10" fill="url(#blzBoxGrad1)" stroke="#6C63FF" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Escudo Heráldico Blazon -->
    <circle cx="26" cy="32" r="14" fill="#6C63FF" fill-opacity="0.3"/>
    <path d="M 26 21 L 34 24.5 V 32 C 34 36.8 30.8 39.5 26 41.5 C 21.2 39.5 18 36.8 18 32 V 24.5 Z" fill="#A78BFA"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#A78BFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">SUITE CORPORATIVA</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Blazon PowerPoint</text>
    <text x="48" y="53" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" opacity="0.9">Add-in M365 &amp; Ribbon</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. BLAZON BRAND ENGINE (Centro) -->
  <!-- ========================================== -->
  <g transform="translate(264, 16)">
    <rect width="172" height="64" rx="10" fill="url(#blzBoxGrad2)" stroke="#8B5CF6" stroke-width="1.4" stroke-opacity="0.7"/>
    
    <!-- Ícono Motor / Hub Central -->
    <circle cx="26" cy="32" r="14" fill="#8B5CF6" fill-opacity="0.35"/>
    <circle cx="26" cy="32" r="6.5" stroke="#C4B5FD" stroke-width="1.5" fill="#6C63FF"/>
    <circle cx="26" cy="32" r="2.5" fill="#FFFFFF"/>
    <line x1="26" y1="21" x2="26" y2="24" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="40" x2="26" y2="43" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="32" x2="18" y2="32" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="32" x2="37" y2="32" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">MOTOR DE IDENTIDAD</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Blazon Brand Engine</text>
    <text x="48" y="53" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" opacity="0.9">Distribución en la Nube</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. DESIGN SYSTEM CENTRAL (Derecha) -->
  <!-- ========================================== -->
  <g transform="translate(512, 16)">
    <rect width="172" height="64" rx="10" fill="url(#blzBoxGrad3)" stroke="#059669" stroke-width="1.2" stroke-opacity="0.55"/>
    
    <!-- Ícono Tokens / Paleta -->
    <circle cx="26" cy="32" r="14" fill="#059669" fill-opacity="0.3"/>
    <circle cx="22.5" cy="29" r="3.2" fill="#6C63FF"/>
    <circle cx="29.5" cy="29" r="3.2" fill="#2563EB"/>
    <circle cx="26" cy="35.5" r="3.2" fill="#34D399"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">SISTEMA DE DISEÑO</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Brand Hub Tokens</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" opacity="0.9">Paletas &amp; Tipografía Sync</text>
  </g>
</svg>
