<svg width="100%" height="96" viewBox="0 0 700 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de conexión Blazon -> Starkio Cloud -> Design System -->
    <linearGradient id="blzConnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Fondos de tarjetas con relieve sutil -->
    <linearGradient id="blzBoxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1638"/>
      <stop offset="100%" stop-color="#0E0A1E"/>
    </linearGradient>
    <linearGradient id="blzBoxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E3B"/>
      <stop offset="100%" stop-color="#0A1024"/>
    </linearGradient>
    <linearGradient id="blzBoxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2E24"/>
      <stop offset="100%" stop-color="#071A14"/>
    </linearGradient>

    <!-- Resplandores -->
    <filter id="blzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Marco perimetral del diagrama con efecto glassmorphism -->
  <rect x="1.5" y="1.5" width="697" height="93" rx="14" fill="#0A0817" fill-opacity="0.85" stroke="#6C63FF" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Línea de Conexión de Tokens y Assets con Acento Gradiente -->
  <path d="M 188 48 L 264 48" stroke="url(#blzConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <path d="M 436 48 L 512 48" stroke="url(#blzConnGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Flechas y Pulso en Tránsito -->
  <polygon points="260,44.5 266,48 260,51.5" fill="#6C63FF"/>
  <polygon points="508,44.5 514,48 508,51.5" fill="#34D399"/>
  <circle cx="206" cy="48" r="3.5" fill="#A78BFA" filter="url(#blzGlow)"/>
  <circle cx="454" cy="48" r="3.5" fill="#6EE7B7" filter="url(#blzGlow)"/>

  <!-- Chip Protocolo 1 (OAUTH2 SSO) -->
  <rect x="198" y="22" width="56" height="15" rx="7.5" fill="#1C1838" stroke="#818CF8" stroke-width="0.8"/>
  <text x="226" y="32.5" text-anchor="middle" fill="#A78BFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">OAUTH2 SSO</text>

  <!-- Chip Protocolo 2 (TOKENS SYNC) -->
  <rect x="444" y="22" width="60" height="15" rx="7.5" fill="#0E2A20" stroke="#34D399" stroke-width="0.8"/>
  <text x="474" y="32.5" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">TOKENS SYNC</text>

  <!-- ========================================== -->
  <!-- 1. BLAZON SUITE (Izquierda) -->
  <!-- ========================================== -->
  <g transform="translate(16, 16)">
    <rect width="172" height="64" rx="10" fill="url(#blzBoxGrad1)" stroke="#6C63FF" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Escudo Heráldico Blazon -->
    <circle cx="26" cy="32" r="14" fill="#6C63FF" fill-opacity="0.3"/>
    <path d="M 26 21 L 34 24.5 V 32 C 34 36.8 30.8 39.5 26 41.5 C 21.2 39.5 18 36.8 18 32 V 24.5 Z" fill="#A78BFA"/>
    
    <!-- Textos con tipografía estructurada y legible -->
    <text x="48" y="24" fill="#A78BFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">SUITE CORPORATIVA</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Blazon PowerPoint</text>
    <text x="48" y="53" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" opacity="0.9">Add-in M365 &amp; Ribbon</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. STARKIO CLOUD AUTH (Centro) -->
  <!-- ========================================== -->
  <g transform="translate(264, 16)">
    <rect width="172" height="64" rx="10" fill="url(#blzBoxGrad2)" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Ícono Candado / OAuth RBAC -->
    <circle cx="26" cy="32" r="14" fill="#2563EB" fill-opacity="0.3"/>
    <rect x="20.5" y="28" width="11" height="9" rx="2" fill="#60A5FA"/>
    <path d="M 22.5 28 V 25 C 22.5 23.3 23.8 22 26 22 C 28.2 22 29.5 23.3 29.5 25 V 28" stroke="#BFDBFE" stroke-width="1.6" fill="none"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#60A5FA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">SEGURIDAD HOLDING</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Starkio Cloud Auth</text>
    <text x="48" y="53" fill="#BFDBFE" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" opacity="0.9">SSO &amp; RBAC Multi-Tenant</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. DESIGN SYSTEM CENTRAL (Derecha) -->
  <!-- ========================================== -->
  <g transform="translate(512, 16)">
    <rect width="172" height="64" rx="10" fill="url(#blzBoxGrad3)" stroke="#059669" stroke-width="1.2" stroke-opacity="0.55"/>
    
    <!-- Ícono Tokens / Paleta -->
    <circle cx="26" cy="32" r="14" fill="#059669" fill-opacity="0.3"/>
    <circle cx="22.5" cy="29" r="3.2" fill="#6C63FF"/>
    <circle cx="29.5" cy="29" r="3.2" fill="#2563EB"/>
    <circle cx="26" cy="35.5" r="3.2" fill="#34D399"/>
    
    <!-- Textos -->
    <text x="48" y="24" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">SISTEMA DE DISEÑO</text>
    <text x="48" y="39" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Brand Hub Tokens</text>
    <text x="48" y="53" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" opacity="0.9">Paletas &amp; Tipografía Sync</text>
  </g>
</svg>
